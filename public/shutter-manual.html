<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務マニュアル｜株式会社ワコウ</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#080e14;color:#cfd8dc;font-family:'Noto Sans JP',sans-serif;min-height:100vh}
  button{cursor:pointer;font-family:inherit}
  a{text-decoration:none}

  /* ヘッダー */
  .header{
    position:sticky;top:0;z-index:10;
    background:#080e14;border-bottom:1px solid #1a2634;
    padding:12px 16px;display:flex;align-items:center;gap:12px;
  }
  .header-title{color:#4fc3f7;font-size:15px;font-weight:700}
  .back-btn{
    padding:6px 14px;border-radius:7px;border:1px solid #1a2634;
    background:transparent;color:#78909c;font-size:12px;
  }
  .back-btn:hover{border-color:#4fc3f7;color:#4fc3f7}

  /* パンくず */
  .breadcrumb{
    padding:8px 16px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;
    border-bottom:1px solid #1a2634;background:#080e14;
  }
  .bc-link{color:#4fc3f7;font-size:12px;cursor:pointer}
  .bc-link:hover{text-decoration:underline}
  .bc-current{color:#cfd8dc;font-size:12px;font-weight:700}
  .bc-sep{color:#546e7a}

  /* カードリスト */
  .card-list{padding:16px;display:flex;flex-direction:column;gap:10px;max-width:600px;margin:0 auto}
  .card{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;background:#0d1520;border-radius:10px;
    border:1px solid #1a263440;cursor:pointer;transition:all 0.15s;
  }
  .card:hover{background:#0d2030}
  .card-emoji{font-size:24px;flex-shrink:0}
  .card-body{flex:1;min-width:0}
  .card-label{font-size:14px;font-weight:700}
  .card-count{font-size:11px;color:#37474f;margin-top:2px}
  .card-arrow{color:#263238;font-size:18px;flex-shrink:0}

  /* ホーム用大カード */
  .card-home{
    padding:18px 16px;background:#0d1520;border-radius:12px;
    border:2px solid #1a263440;cursor:pointer;transition:all 0.15s;
  }
  .card-home:hover{background:#0d2030}
  .card-home-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .card-home-emoji{font-size:30px}
  .card-home-label{font-size:16px;font-weight:800}
  .card-home-desc{font-size:11px;color:#37474f;padding-left:4px}

  /* 詳細ページ */
  .detail{padding:16px;max-width:600px;margin:0 auto}
  .detail-title{color:#fff;font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .detail-body{
    color:#cfd8dc;font-size:13px;line-height:1.9;white-space:pre-wrap;
    background:#0a1018;border-radius:8px;padding:14px;border:1px solid #1a2634;
  }
  .detail-empty{color:#263238;font-size:12px;text-align:center;padding:40px}
  .detail-images{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .detail-img{max-width:100%;border-radius:8px;cursor:pointer;display:block}
  .detail-img-caption{color:#546e7a;font-size:11px;margin-top:4px}

  /* ホーム */
  .home-grid{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:600px;margin:0 auto}

  .print-only{display:none}

  /* OSD調査票スタイル */
  .topbar{position:sticky;top:0;z-index:20;background:#080e14;border-bottom:1px solid #1a2634;padding:10px 14px;display:flex;gap:8px;align-items:center}
  .topbar-title{flex:1;color:#ffd54f;font-size:13px;font-weight:700}
  .pdf-btn{padding:6px 14px;border-radius:7px;border:none;background:#ffd54f;color:#080e14;font-size:12px;font-weight:800}
  .edit-btn{padding:6px 12px;border-radius:7px;border:1px solid #1a2634;background:transparent;color:#546e7a;font-size:11px;font-weight:700}
  .edit-btn.active{border-color:#ff8a65;background:#2a1000;color:#ff8a65}
  .sheet{max-width:640px;margin:0 auto;padding:20px 16px 80px}
  .sheet-title{text-align:center;border-bottom:2px solid #4fc3f7;padding-bottom:12px;margin-bottom:20px}
  .sheet-title h1{font-size:18px;font-weight:900;letter-spacing:2px;color:#fff}
  .sheet-title p{font-size:10px;color:#546e7a;margin-top:4px}
  .sec-block{margin-bottom:4px}
  .sec-title{background:#1a2634;color:#4fc3f7;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:800;margin-bottom:10px;margin-top:18px;display:flex;align-items:center;gap:6px}
  .sec-title-text{flex:1}
  .edit-del-btn{padding:2px 8px;border-radius:4px;border:none;background:#2a1010;color:#ef5350;font-size:11px;cursor:pointer;flex-shrink:0}
  .edit-add-btn{width:100%;padding:8px;border-radius:6px;border:1px dashed #37474f;background:transparent;color:#546e7a;font-size:11px;cursor:pointer;margin-top:4px}
  .edit-add-btn:hover{border-color:#ff8a65;color:#ff8a65}
  .edit-label-input{flex:1;border:none;border-bottom:1px solid #37474f;outline:none;font-size:12px;font-weight:700;font-family:inherit;color:#cfd8dc;background:transparent;min-width:60px}
  .edit-sec-input{flex:1;border:none;border-bottom:1px solid #4fc3f7;outline:none;font-size:12px;font-weight:800;font-family:inherit;color:#4fc3f7;background:transparent}
  .add-sec-btn{width:100%;padding:10px;border-radius:6px;border:1px dashed #4fc3f7;background:transparent;color:#4fc3f7;font-size:12px;font-weight:700;cursor:pointer;margin-top:12px}
  .add-sec-btn:hover{background:#0d2030}
  .field-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;font-size:12px;flex-wrap:wrap}
  .field-label{min-width:90px;font-weight:700;color:#78909c;flex-shrink:0}
  .field-input{flex:1;border:none;border-bottom:1px solid #1a2634;outline:none;font-size:12px;padding:3px 4px;font-family:inherit;background:transparent;color:#cfd8dc;word-break:break-all;white-space:pre-wrap}
  .field-input:focus{border-bottom-color:#4fc3f7}
  .field-note{color:#263238;font-size:10px;margin-top:2px;padding-left:98px}
  .area-wrap{margin-bottom:12px}
  .area-input{width:100%;border-radius:4px;border:1px solid #1a2634;outline:none;font-size:12px;padding:8px;font-family:inherit;background:#0a1018;color:#cfd8dc;resize:vertical;min-height:70px}
  .area-input:focus{border-color:#4fc3f7}
  .note-box{margin-bottom:12px;padding:8px 12px;background:#1a1400;border-left:3px solid #ffd54f;border-radius:0 6px 6px 0;font-size:11px;color:#78909c}
  .check-item{margin-bottom:10px;border-radius:8px;overflow:hidden;border:1px solid #1a2634}
  .check-item.active{border-color:#1a3a1a}
  .check-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0a1018;cursor:pointer;user-select:none}
  .check-item.active .check-header{background:#0a1f0a}
  .check-box{width:22px;height:22px;border-radius:5px;border:2px solid #37474f;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#080e14;font-weight:900;transition:all 0.15s}
  .check-item.active .check-box{border-color:#a5d6a7;background:#a5d6a7}
  .check-name{font-weight:700;font-size:13px;color:#546e7a;flex:1;transition:color 0.15s}
  .check-item.active .check-name{color:#a5d6a7}
  .check-body{padding:12px 14px;background:#0a1018;border-top:1px solid #1a2634;display:none}
  .check-item.active .check-body{display:block}
  .subtype-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .subtype-bar-label{font-size:11px;color:#37474f}
  .subtype-btn{padding:6px 16px;border-radius:7px;border:1px solid #1a2634;background:transparent;color:#546e7a;font-size:12px;font-weight:700;transition:all 0.15s}
  .subtype-btn.sel{border-color:#4fc3f7;background:#0d2030;color:#4fc3f7}
  .subtype-fields{display:none}
  .subtype-fields.show{display:block}
  .sunpou-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .sunpou-item{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid #1a2634}
  .sunpou-label{font-size:12px;font-weight:700;color:#78909c;min-width:130px;flex-shrink:0}
  .sunpou-input{flex:1;border:none;border-bottom:1px solid #1a2634;outline:none;font-size:12px;font-weight:700;padding:2px 4px;font-family:inherit;background:transparent;color:#cfd8dc;text-align:right;max-width:100px}
  .sunpou-unit{font-size:11px;color:#546e7a;flex-shrink:0}
  .sel-group{display:flex;gap:6px;flex-wrap:wrap}
  .sel-opt{padding:5px 14px;border-radius:6px;border:1px solid #1a2634;background:transparent;color:#546e7a;font-size:12px;font-weight:700;transition:all 0.15s}
  .sel-opt.sel{border-color:#4fc3f7;background:#0d2030;color:#4fc3f7}
  .recommend-box{background:#0d1520;border-radius:8px;padding:14px;border:1px solid #1a263440;margin-bottom:12px}
  .recommend-label{font-size:11px;color:#ffd54f;font-weight:700;margin-bottom:8px}
  .add-check-btn{width:100%;padding:8px;border-radius:6px;border:1px dashed #a5d6a7;background:transparent;color:#a5d6a7;font-size:11px;cursor:pointer;margin-top:4px;display:none}
  .editmode .add-check-btn{display:block}
  .sort-btn{padding:2px 6px;border-radius:4px;border:1px solid #1a2634;background:transparent;color:#546e7a;font-size:11px;cursor:pointer;flex-shrink:0}
  .sort-btn:hover{border-color:#4fc3f7;color:#4fc3f7}
  .sort-btn:disabled{opacity:0.2;cursor:default}
  @page{size:A4 portrait;margin:12mm 15mm}
  @media print {
    .no-print{display:none!important}
    .print-only{display:block!important}
    .topbar{display:none!important}
    body{background:white!important;color:#111!important}
    .sheet{padding:0}
    .sec-title{background:#222!important;color:#fff!important}
    .check-item:not(.active){display:none!important}
    .check-header{display:none!important}
    .check-body{display:block!important}
    .subtype-fields{display:none!important}
    .subtype-fields.show{display:block!important}
    .check-item.active{border-color:#ccc!important;margin-bottom:14px!important}
    .check-item.active .check-body{border-top:none!important}
    .check-item.active::before{content:attr(data-name);display:block;font-size:12px;font-weight:800;padding:5px 12px;background:#222;color:#fff}
    .field-input,.sunpou-input,.area-input{color:#111!important;background:white!important;border-color:#aaa!important}
    textarea.field-input{overflow:visible!important;height:auto!important;white-space:pre-wrap!important;word-break:break-all!important}
    .field-row{page-break-inside:avoid!important;break-inside:avoid!important}
    .check-item.active{page-break-inside:avoid!important;break-inside:avoid!important}
    .sunpou-item{page-break-inside:avoid!important;break-inside:avoid!important}
    .area-wrap{page-break-inside:avoid!important;break-inside:avoid!important}
    .sec-block{page-break-inside:avoid!important;break-inside:avoid!important}
    .field-label,.sunpou-label,.recommend-label{color:#333!important}
    .field-note,.note-box{display:none!important}
    .subtype-btn,.sel-opt{border-color:#ccc!important;color:#555!important}
    .subtype-btn.sel,.sel-opt.sel{background:#e8f4f8!important;border-color:#666!important;color:#111!important}
    .edit-del-btn,.edit-add-btn,.add-sec-btn,.add-check-btn{display:none!important}
    .note-print-hide{display:none!important}
  }

  /* タイトルロゴ */
  .logo-area{text-align:center;padding:32px 16px 24px}
  .logo-title{color:#fff;font-size:28px;font-weight:900;letter-spacing:-1px}
  .logo-sub{color:#263238;font-size:12px;margin-top:6px}
  .logo-badge{color:#4fc3f7;font-size:10px;letter-spacing:4px;font-weight:700;margin-bottom:8px}
</style>
</head>

// 状態管理
// ═══════════════════════════════════════
let surveyEditMode = false;
let surveyData = JSON.parse(JSON.stringify(DEFAULT_DATA));
const CURRENT_VERSION = 3;

function save() {
  localStorage.setItem('osd_form_v3', JSON.stringify(surveyData));
  localStorage.setItem('osd_form_version', CURRENT_VERSION);
}

function load() {
  try {
    let saved = localStorage.getItem('osd_form_v3');
    if (!saved) saved = localStorage.getItem('osd_form_v2');
    if (saved) {
      const parsed = JSON.parse(saved);
      surveyData = parsed;
      migrate(surveyData);
    }
  } catch(e) {}
  const sec = surveyData.sections.find(s => s.id === 's1');
  if (sec) {
    const df = sec.fields.find(f => f.type === 'date');
    if (df && !df.value) df.value = new Date().toISOString().split('T')[0];
  }
}

function migrate(d) {
  const s1 = d.sections && d.sections.find(s => s.id === 's1');
  if (s1 && s1.fields) {
    let f6 = s1.fields.find(f => f.id === 'f6');
    if (!f6) {
      s1.fields.push({
        id: 'f6', label: '動作', type: 'select', options: ['電動', '手動'], value: '',
        children: [
          { matchValue: '電動', field: { id: 'f6c1', label: '電源', type: 'select', options: ['100V', '200V', '400V'], value: '' } },
          { matchValue: '電動', field: { id: 'f6c2', label: '開閉機名', type: 'text', value: '' } }
        ]
      });
    } else {
      if (!f6.children) f6.children = [];
      if (!f6.children.find(c => c.field && c.field.id === 'f6c1'))
        f6.children.push({ matchValue: '電動', field: { id: 'f6c1', label: '電源', type: 'select', options: ['100V', '200V', '400V'], value: '' } });
      if (!f6.children.find(c => c.field && c.field.id === 'f6c2'))
        f6.children.push({ matchValue: '電動', field: { id: 'f6c2', label: '開閉機名', type: 'text', value: '' } });
    }
  }
  d.sections && d.sections.forEach(sec => {
    if (sec.type === 'checks' && sec.items) {
      sec.items.forEach(item => {
        if (item.showNote === undefined) item.showNote = true;
      });
    }
  });
  save();
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function autoResize(el) { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

  if (!_surveyLoaded) { load(); _surveyLoaded = true; }
  const app = document.getElementById('app');
  app.innerHTML = `

function renderSurveySheet() {
  const sheet = document.getElementById('sheet');
  if (!sheet) return;
  let h = '';
  if(surveyEditMode){
    h += `<div class="sheet-title"><input value="${esc(surveyData.title||'OSD一式交換調査票')}" onchange="surveyData.title=this.value;save()" style="width:100%;border:none;border-bottom:2px solid #4fc3f7;outline:none;font-size:18px;font-weight:900;letter-spacing:2px;color:#fff;background:transparent;text-align:center;font-family:inherit;padding:4px 0"><p style="font-size:10px;color:#546e7a;margin-top:8px">株式会社ワコウ</p></div>`;
  } else {
    h += `<div class="sheet-title"><h1>${esc(surveyData.title||'OSD一式交換調査票')}</h1><p>株式会社ワコウ</p></div>`;
  }

  surveyData.sections.forEach((sec, si) => {
    h += renderSection(sec, si);
  });

  if (surveyEditMode) {
    h += `<button class="add-sec-btn" onclick="addSection()">&#65291; セクションを追加</button>`;
  }

  sheet.innerHTML = h;
  if (surveyEditMode) sheet.classList.add('editmode');
  else sheet.classList.remove('editmode');
}

function renderSection(sec, si) {
  let h = `<div class="sec-block" data-si="${si}">`;

  h += `<div class="sec-title">`;
  if (surveyEditMode) {
    h += `<button class="sort-btn" onclick="moveSection(${si},-1)" ${si===0?'disabled':''}>&#9650;</button>`;
    h += `<button class="sort-btn" onclick="moveSection(${si},1)" ${si===surveyData.sections.length-1?'disabled':''}>&#9660;</button>`;
    h += `<input class="edit-sec-input" value="${esc(sec.title)}" onchange="updateSecTitle(${si},this.value)">`;
    h += `<button class="edit-del-btn" onclick="deleteSection(${si})">&#128465;&#65039;</button>`;
  } else {
    h += `<span class="sec-title-text">&#9632; ${esc(sec.title)}</span>`;
  }
  h += `</div>`;

  if (sec.type === 'fields') {
    h += renderFields(sec, si);
    if (surveyEditMode) {
      h += `<div style="display:flex;gap:6px;margin-top:4px">`;
      h += `<button class="edit-add-btn" style="margin-top:0" onclick="addField(${si},'text')">&#65291; テキスト</button>`;
      h += `<button class="edit-add-btn" style="margin-top:0;border-color:#ffd54f;color:#ffd54f" onclick="addField(${si},'select')">&#65291; 選択式</button>`;
      h += `</div>`;
    }
  } else if (sec.type === 'sunpou') {
    h += renderSunpou(sec, si);
    if (surveyEditMode) {
      h += `<button class="edit-add-btn" onclick="addSunpouField(${si})">&#65291; 寸法項目を追加</button>`;
    }
  } else if (sec.type === 'note_area') {
    h += renderNoteArea(sec, si);
  } else if (sec.type === 'checks') {
    h += renderChecks(sec, si);
    h += `<button class="add-check-btn" onclick="addCheckItem(${si})">&#65291; 交換部品を追加</button>`;
  }

  h += `</div>`;
  return h;
}

function renderFields(sec, si) {
  let h = '';
  (sec.fields||[]).forEach((f, fi) => {
    h += `<div class="field-row">`;
    if (surveyEditMode) {
      h += `<div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0">`;
      h += `<button class="sort-btn" style="padding:1px 5px;font-size:9px" onclick="moveField(${si},${fi},-1)" ${fi===0?'disabled':''}>&#9650;</button>`;
      h += `<button class="sort-btn" style="padding:1px 5px;font-size:9px" onclick="moveField(${si},${fi},1)" ${fi===(sec.fields.length-1)?'disabled':''}>&#9660;</button>`;
      h += `</div>`;
      h += `<input class="edit-label-input" value="${esc(f.label)}" onchange="updateFieldLabel(${si},${fi},this.value)" style="min-width:80px;width:90px">`;
    } else {
      h += `<div class="field-label">${esc(f.label)}</div>`;

      h += `<input class="field-input" type="date" value="${esc(f.value)}" onchange="updateFieldValue(${si},${fi},this.value)">`;

                h += `<div style="display:flex;align-items:center;gap:2px;background:#0d2030;border:1px solid #1a2634;border-radius:6px;padding:2px 6px">`;
                h += `<input value="${esc(opt2)}" onchange="updateCheckChildOption(${si},${ii},${sti},${fi},'${esc(opt)}',${ci},${oi2},this.value)" style="border:none;outline:none;font-size:11px;color:#4fc3f7;background:transparent;width:55px;font-family:inherit">`;
                h += `<button onclick="deleteCheckChildOption(${si},${ii},${sti},${fi},'${esc(opt)}',${ci},${oi2})" style="border:none;background:transparent;color:#ef5350;font-size:10px;cursor:pointer;padding:0 2px">&#10005;</button>`;
                h += `</div>`;
              });
              h += `<button onclick="addCheckChildOption(${si},${ii},${sti},${fi},'${esc(opt)}',${ci})" style="padding:2px 8px;border-radius:6px;border:1px dashed #ffd54f;background:transparent;color:#ffd54f;font-size:10px;cursor:pointer">&#65291;</button>`;
              h += `</div>`;
            }
            h += `</div>`;
          });
          h += `<div style="display:flex;gap:4px;padding-left:8px">`;
          h += `<button onclick="addCheckChild(${si},${ii},${sti},${fi},'${esc(opt)}','text')" style="padding:2px 8px;border-radius:4px;border:1px dashed #37474f;background:transparent;color:#546e7a;font-size:10px;cursor:pointer">&#65291;テキスト</button>`;
          h += `<button onclick="addCheckChild(${si},${ii},${sti},${fi},'${esc(opt)}','select')" style="padding:2px 8px;border-radius:4px;border:1px dashed #ffd54f;background:transparent;color:#ffd54f;font-size:10px;cursor:pointer">&#65291;選択式</button>`;
          h += `</div>`;
          h += `</div>`;
        });
        h += `</div>`;
      }
    }
    if (!surveyEditMode && f.type === 'select' && f.children && f.children.length > 0) {
      const parentVals = Array.isArray(f.value) ? f.value : (f.value ? [f.value] : []);
      f.children.forEach((child, ci) => {
        if (!parentVals.includes(child.matchValue)) return;
        const cf2 = child.field;
        h += `<div class="field-row" style="padding-left:16px;border-left:2px solid #4fc3f7;margin-left:8px;margin-top:4px">`;
        h += `<div class="field-label" style="color:#4fc3f7">${esc(cf2.label)}</div>`;
        if (cf2.type === 'select') {
          const selVals = Array.isArray(cf2.value) ? cf2.value : (cf2.value ? [cf2.value] : []);
          h += `<div class="sel-group">`;
          (cf2.options||[]).forEach(opt2 => {
            const isSel = selVals.includes(opt2);
            const fn = cf2.multi ? `toggleCheckChildOpt` : `selectCheckChild`;
            h += `<button class="sel-opt${isSel?' sel':''}" onclick="${fn}(${si},${ii},${sti},${fi},${ci},'${esc(opt2)}')">${esc(opt2)}</button>`;
          });
          h += `</div>`;
        } else {
          h += `<textarea class="field-input" rows="1" oninput="autoResize(this)" onchange="updateCheckChildValue(${si},${ii},${sti},${fi},${ci},this.value)" style="resize:none;overflow:hidden;line-height:1.5;padding-top:4px;padding-bottom:4px">${esc(Array.isArray(cf2.value)?cf2.value.join(", "):cf2.value||"")}</textarea>`;
        }
        h += `</div>`;
      });
    }
  });
  return h;
}

function findNode(id, nodes) {
  for (const n of nodes) {
    if (n.id === id) return n;
    if (n.children) { const f = findNode(id, n.children); if (f) return f; }
  }
  return null;
}

// localStorage 保存
// ═══════════════════════════
function getOverrides() {
  try { return JSON.parse(localStorage.getItem('manual_overrides') || '{}'); } catch { return {}; }
}
function getDeleted() {
  try { return JSON.parse(localStorage.getItem('manual_deleted') || '[]'); } catch { return []; }
}
function isDeleted(id) { return getDeleted().includes(id); }

function getDesc(node) {
  const ov = getOverrides();
  return ov[node.id]?.description ?? node.description;
}
function getLabel(node) {
  const ov = getOverrides();
  return ov[node.id]?.label ?? node.label;
}
function saveDesc(nodeId) {
  const ta = document.getElementById('edit-ta');
  if (!ta) return;
  const ov = getOverrides();
  ov[nodeId] = { ...(ov[nodeId]||{}), description: ta.value };
  localStorage.setItem('manual_overrides', JSON.stringify(ov));
  editMode = false;
  render();
}
function startLabelEdit(nodeId) {
  const node = findNode(nodeId, MANUAL_TREE);
  const current = getLabel(node);
  const newLabel = prompt('名前を変更', current);
  if (newLabel !== null && newLabel.trim() !== '') {
    const ov = getOverrides();
    ov[nodeId] = { ...(ov[nodeId]||{}), label: newLabel.trim() };
    localStorage.setItem('manual_overrides', JSON.stringify(ov));
    render();
  }
}
function deleteNode(nodeId) {
  const node = findNode(nodeId, MANUAL_TREE) || findAddedNode(nodeId);
  const label = node ? getLabel(node) : nodeId;
  if (!confirm('「' + label + '」を削除しますか？')) return;
  const deleted = getDeleted();
  if (!deleted.includes(nodeId)) deleted.push(nodeId);
  localStorage.setItem('manual_deleted', JSON.stringify(deleted));
  render();
}
function getAddedNodes(parentId) {
  try { return JSON.parse(localStorage.getItem('manual_added_' + parentId) || '[]'); } catch { return []; }
}
function findAddedNode(id) {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('manual_added_'));
  for (const k of keys) {
    try {
      const nodes = JSON.parse(localStorage.getItem(k) || '[]');
      const found = nodes.find(n => n.id === id);
      if (found) return found;
    } catch {}
  }
  return null;
}
function addNode(parentId) {
  const label = prompt('項目名を入力してください');
  if (!label || !label.trim()) return;
  const id = 'added_' + Date.now();
  const nodes = getAddedNodes(parentId);
  nodes.push({ id, label: label.trim(), emoji: '📄', color: '#cfd8dc', description: '', images: [] });
  localStorage.setItem('manual_added_' + parentId, JSON.stringify(nodes));
  render();
}

// ═══════════════════════════
// 状態管理
// ═══════════════════════════
let path = [];
let editMode = true; // とりあえず編集モードON

function render() {
  const app = document.getElementById('app');
  const currentNode = path.length > 0 ? (findNode(path[path.length-1], MANUAL_TREE) || findAddedNode(path[path.length-1])) : null;
  const isLeaf = currentNode && (!currentNode.children || currentNode.children.length === 0);
  const breadcrumb = path.map(id => findNode(id, MANUAL_TREE)).filter(Boolean);

  let html = '';

  // ヘッダー
  html += `<div class="header" style="background:${editMode?'#1a0a00':'#080e14'}">`;
  if (path.length > 0) {
    html += '<button class="back-btn" onclick="goBack()">&larr; 戻る</button>';
  }
  html += `<div class="header-title" style="flex:1">📘 業務マニュアル</div>`;
  html += `<button onclick="editMode=!editMode;render()" style="padding:5px 12px;border-radius:6px;border:1px solid ${editMode?'#ff8a65':'#1a2634'};background:${editMode?'#2a1000':'transparent'};color:${editMode?'#ff8a65':'#37474f'};font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">${editMode?'✏️ 編集中':'✏️ 編集'}</button>`;
  html += `</div>`;

  // パンくず
  if (breadcrumb.length > 0) {
    html += `<div class="breadcrumb">`;
    html += `<span class="bc-link" onclick="goTo(0)">ホーム</span>`;
    breadcrumb.forEach((n, i) => {
      html += `<span class="bc-sep">›</span>`;
      if (i < breadcrumb.length - 1) {
        html += `<span class="bc-link" onclick="goTo(${i+1})">${getLabel(n)}</span>`;
      } else {
        html += `<span class="bc-current">${getLabel(n)}</span>`;
      }
    });
    html += `</div>`;
  }

  if (path.length === 0) {
    // ホーム画面
    html += `<div style="text-align:center;padding:28px 16px 20px">`;
    html += `<div class="logo-badge">WORK MANUAL</div>`;
    html += `<div class="logo-title">業務マニュアル</div>`;
    html += `<div class="logo-sub">株式会社ワコウ</div>`;
    html += `</div>`;
    html += `<div class="home-grid">`;
    MANUAL_TREE.forEach((n, i) => {
      html += `<div class="card-home" style="border-color:${n.color}40" onclick="pushNode('${n.id}')">`;
      html += `<div class="card-home-top">`;
      html += `<span class="card-home-emoji">${n.emoji}</span>`;
      html += `<span class="card-home-label" style="color:${n.color}">${n.label}</span>`;
      html += `</div>`;
      html += `<div class="card-home-desc">${n.desc}</div>`;
      html += `</div>`;
    });
    html += `</div>`;
  } else if (isLeaf) {
    const desc = getDesc(currentNode);
    // 詳細ページ
    html += `<div class="detail">`;
    html += `<div class="detail-title">${currentNode.emoji||'📄'} ${currentNode.label}</div>`;
    if (editMode) {
      html += `<textarea id="edit-ta" style="width:100%;min-height:200px;background:#0a1018;border:1px solid #ff8a65;border-radius:8px;padding:12px;color:#cfd8dc;font-size:13px;line-height:1.8;font-family:inherit;resize:vertical;outline:none">${escapeHtml(desc)}</textarea>`;
      html += `<button onclick="saveDesc('${currentNode.id}')" style="width:100%;margin-top:8px;padding:12px;border-radius:8px;border:none;background:#ff8a65;color:#080e14;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit">💾 保存</button>`;
    } else {
      if (desc) {
        html += `<div class="detail-body">${escapeHtml(desc)}</div>`;
      } else {
        html += `<div class="detail-empty">内容準備中</div>`;
      }
    }
    // 保存済み画像
    const savedImgs = getImages(currentNode.id);
    const savedLinks = getLinks(currentNode.id);
    if (savedImgs.length > 0 || savedLinks.length > 0) {
      html += `<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">`;
      savedImgs.forEach(img => {
        html += `<div style="position:relative">`;
        html += `<img src="${img.data}" style="max-width:100%;border-radius:8px;cursor:pointer;display:block" onclick="window.open('${img.data}','_blank')">`;
        if (editMode) html += `<button onclick="deleteImage('${currentNode.id}','${img.id}')" style="position:absolute;top:6px;right:6px;padding:3px 8px;border-radius:5px;border:none;background:rgba(0,0,0,0.7);color:#ef5350;font-size:12px;cursor:pointer">🗑️</button>`;
        html += `</div>`;
      });
      savedLinks.forEach(lnk => {
        html += `<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0a1018;border-radius:8px;border:1px solid #1a2634">`;
        html += `<a href="${lnk.url}" target="_blank" style="flex:1;color:#4fc3f7;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📎 ${escapeHtml(lnk.label)}</a>`;
        if (editMode) html += `<button onclick="deleteLink('${currentNode.id}','${lnk.id}')" style="padding:2px 8px;border-radius:5px;border:none;background:transparent;color:#ef5350;font-size:12px;cursor:pointer;flex-shrink:0">🗑️</button>`;
        html += `</div>`;
      });
      html += `</div>`;
    }
    if (editMode) {
      html += `<div style="display:flex;gap:8px;margin-top:12px">`;
      html += `<button onclick="triggerImageUpload('${currentNode.id}')" style="flex:1;padding:10px;border-radius:8px;border:1px dashed #ff8a65;background:transparent;color:#ff8a65;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">📷 画像を追加</button>`;
      html += `<button onclick="addLink('${currentNode.id}')" style="flex:1;padding:10px;border-radius:8px;border:1px dashed #4fc3f7;background:transparent;color:#4fc3f7;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">📎 リンクを追加</button>`;
      html += `</div>`;
    }
    html += '<button class="back-btn" onclick="goBack()" style="margin-top:20px;width:100%;padding:12px;font-size:13px;">&larr; 戻る</button>';
    html += `</div>`;
  } else {
    // 中間ノード（子リスト）
    const list = currentNode ? (currentNode.children || []) : MANUAL_TREE;
    const added = getAddedNodes(currentNode ? currentNode.id : 'root');
    const allList = [...list, ...added].filter(n => !isDeleted(n.id));
    html += `<div class="card-list">`;
    allList.forEach((n) => {
      const label = getLabel(n);
      const isChildLeaf = !n.children || n.children.length === 0;
      html += `<div class="card" style="border-color:${n.color||'#4fc3f7'}40" onclick="pushNode('${n.id}')">`;
      html += `<span class="card-emoji">${n.emoji||'📄'}</span>`;
      html += `<div class="card-body">`;
      html += `<div class="card-label" style="color:${n.color||'#cfd8dc'}">${label}</div>`;
      if (!isChildLeaf) {
        const cnt = (n.children||[]).filter(c=>!isDeleted(c.id)).length + getAddedNodes(n.id).length;
        html += `<div class="card-count">${cnt}項目</div>`;
      }
      html += `</div>`;
      if (editMode) {
        html += `<div style="display:flex;gap:4px" onclick="event.stopPropagation()">`;
        html += `<button onclick="startLabelEdit('${n.id}')" style="padding:4px 8px;border-radius:5px;border:1px solid #1a2634;background:transparent;color:#4fc3f7;font-size:11px;cursor:pointer;font-family:inherit">✏️</button>`;
        html += `<button onclick="deleteNode('${n.id}')" style="padding:4px 8px;border-radius:5px;border:1px solid #1a2634;background:transparent;color:#ef5350;font-size:11px;cursor:pointer;font-family:inherit">🗑️</button>`;
        html += `</div>`;
      } else {
        html += `<span class="card-arrow">›</span>`;
      }
      html += `</div>`;
    });
    if (editMode) {
      const parentId = currentNode ? currentNode.id : 'root';
      html += `<button onclick="addNode('${parentId}')" style="width:100%;padding:12px;border-radius:10px;border:1px dashed #ff8a65;background:transparent;color:#ff8a65;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px">＋ 項目を追加</button>`;
    }
    html += `</div>`;
  }

  app.innerHTML = html;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pushNode(id) {
  if (id === 'osd_chosahyo') {
    path.push(id);
    surveyEditMode = false;
    renderSurveyForm();
    window.scrollTo(0, 0);
    return;
  }
  path.push(id);
  render();
  window.scrollTo(0, 0);
}

function goBack() {
  path.pop();
  render();
  window.scrollTo(0, 0);
}

function goTo(depth) {
  path = path.slice(0, depth);
  render();
  window.scrollTo(0, 0);
}

// ═══════════════════════════
// 画像・リンク管理
// ═══════════════════════════
async function compressToBase64(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1000;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = url;
  });
}
function getImages(nodeId) {
  try { return JSON.parse(localStorage.getItem('manual_imgs_' + nodeId) || '[]'); } catch { return []; }
}
function getLinks(nodeId) {
  try { return JSON.parse(localStorage.getItem('manual_links_' + nodeId) || '[]'); } catch { return []; }
}
async function handleImageUpload(nodeId, file) {
  const data = await compressToBase64(file);
  const imgs = getImages(nodeId);
  imgs.push({ id: Date.now().toString(), data });
  localStorage.setItem('manual_imgs_' + nodeId, JSON.stringify(imgs));
  render();
}
function deleteImage(nodeId, imgId) {
  const imgs = getImages(nodeId).filter(i => i.id !== imgId);
  localStorage.setItem('manual_imgs_' + nodeId, JSON.stringify(imgs));
  render();
}
function addLink(nodeId) {
  const url = prompt('URLを入力（Google Drive, PDF など）');
  if (!url || !url.trim()) return;
  const label = prompt('ファイル名・ラベルを入力') || url;
  const links = getLinks(nodeId);
  links.push({ id: Date.now().toString(), url: url.trim(), label: label.trim() });
  localStorage.setItem('manual_links_' + nodeId, JSON.stringify(links));
  render();
}
function deleteLink(nodeId, linkId) {
  const links = getLinks(nodeId).filter(l => l.id !== linkId);
  localStorage.setItem('manual_links_' + nodeId, JSON.stringify(links));
  render();
}
function triggerImageUpload(nodeId) {
  const input = document.getElementById('img-upload-input');
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (file) await handleImageUpload(nodeId, file);
    input.value = '';
  };
  input.click();
}

// 初期描画
render();
</script>
